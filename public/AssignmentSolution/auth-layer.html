<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Contributor Gateway...</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      if (!params.get('go-to') && !params.get('goto') && !params.get('redirect')) {
        params.set('go-to', '/AssignmentSolution/generate.html');
      }
      const search = params.toString() ? ('?' + params.toString()) : '';
      const hash = window.location.hash || '';
      window.location.replace('/auth-layer.html' + search + hash);
    })();
  </script>
</head>
<body style="background:#0a0d14; color:#94a3b8; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Redirecting to Contributor Authentication Gateway...</p>
</body>
</html>
