<script>
// ─ Params & Dual-Mode Resolver ─────────────────────────────────────────────
const P = new URLSearchParams(location.search);
let resourceId = P.get('resourceID') || P.get('resourceId') || P.get('id') || P.get('docid') || '';
let pdfUrl  = P.get('pdf')         || '';
let docTitle= P.get('title')       || 'Untitled Document';
let docCat  = P.get('category')    || '—';
let docDisc = P.get('discipline')  || '—';
let docUp   = P.get('uploader')    || '—';
let docId   = resourceId           || P.get('docid') || '—';
let docDesc = P.get('description') || '';
let docTags = P.get('tags')        || '';

function updateDocMetadataUI() {
  document.title = `${docTitle} — DPGNotes PDF Viewer`;
  document.getElementById('navTitle').textContent = docTitle;
  document.getElementById('mTitle').textContent   = docTitle;
  document.getElementById('mCat').textContent     = docCat;
  document.getElementById('mDisc').textContent    = docDisc;
  document.getElementById('mUp').textContent      = docUp;
  document.getElementById('mId').textContent      = docId;

  if (docDesc) {
    document.getElementById('mDesc').textContent    = docDesc;
    document.getElementById('mDescWrap').style.display = 'block';
  }
  if (docTags) {
    const tEl = document.getElementById('mTags');
    tEl.innerHTML = '';
    const tagsArr = typeof docTags === 'string' ? docTags.split(',') : (Array.isArray(docTags) ? docTags : []);
    tagsArr.forEach(t => {
      const s = String(t).trim(); if (s) tEl.innerHTML += `<span class="btag">${s}</span>`;
    });
    document.getElementById('mTagsWrap').style.display = 'block';
  }
}

// ─ PDF Render ───────────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
const pdfArea  = document.getElementById('pdfArea');
const spinner  = document.getElementById('loadSpinner');
let pdfDoc = null, totalPages = 0;

function adSlot(n) {
  const d = document.createElement('div');
  d.className = 'adslot';
  d.id = `ad-${n}`;
  d.innerHTML = `<div style="width:100%;text-align:center;padding:.5rem;">
    <!-- GOOGLE ADSENSE SCRIPT HERE -->
    <!-- Paste your AdSense <ins class="adsbygoogle"> tag below this comment -->
<!-- Google Ads -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-5515547448097504"
     data-ad-slot="2895051790"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
  </div>`;
  return d;
}

async function renderAllPages() {
  if (!pdfUrl) {
    spinner.innerHTML = `<i class="ri-file-warning-line" style="font-size:3rem;color:#ef4444;"></i><p style="color:#ef4444;">No PDF URL provided.</p>`;
    return;
  }
  try {
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    totalPages = pdfDoc.numPages;
    spinner.style.display = 'none';
    document.getElementById('pgTotal').textContent = totalPages;
    document.getElementById('pgCur').textContent   = '1';

    for (let i = 1; i <= totalPages; i++) {
      await renderPage(i);
      // Ad after every 3rd page (not after the last)
      if (i % 3 === 0 && i < totalPages) {
        pdfArea.appendChild(adSlot(Math.floor(i/3)));
        try {
          (adsbygoogle = window.adsbygoogle || []).push({});
        } catch(e) {
          console.error("AdSense push error:", e);
        }
      }
    }

    // Intersection observer for current page
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) document.getElementById('pgCur').textContent = e.target.dataset.pg;
      });
    }, { threshold: 0.4 });
    pdfArea.querySelectorAll('.pdfpage').forEach(p => obs.observe(p));

  } catch(err) {
    console.error(err);
    spinner.innerHTML = `<i class="ri-file-warning-line" style="font-size:3rem;color:#ef4444;"></i><p style="color:#ef4444;">Failed to load PDF.</p>`;
    spinner.style.display = 'flex';
  }
}

async function renderPage(n) {
  const page     = await pdfDoc.getPage(n);
  const scale    = Math.min(window.devicePixelRatio||1, 2) * 1.15;
  const viewport = page.getViewport({scale});
  const canvas   = document.createElement('canvas');
  const ctx      = canvas.getContext('2d');
  canvas.width   = viewport.width;
  canvas.height  = viewport.height;
  const wrap     = document.createElement('div');
  wrap.className = 'pdfpage';
  wrap.dataset.pg = n;
  wrap.appendChild(canvas);
  pdfArea.appendChild(wrap);
  await page.render({canvasContext:ctx, viewport}).promise;
}

// ─ AI Analysis (Chat Mode) ──────────────────────────────────────────────────
let pdfChatHistory = [];

function appendPdfChatMessage(role, text) {
  const chatArea = document.getElementById("aiChatArea");
  if (!chatArea) return;

  const msgDiv = document.createElement("div");
  msgDiv.className = `chat-msg ${role}`;
  
  if (role === 'user') {
    msgDiv.style.alignSelf = 'flex-end';
    msgDiv.style.background = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
    msgDiv.style.color = 'white';
    msgDiv.style.padding = '0.5rem 0.75rem';
    msgDiv.style.borderRadius = '10px';
    msgDiv.style.borderBottomRightRadius = '2px';
    msgDiv.style.fontSize = '0.8rem';
    msgDiv.style.lineHeight = '1.4';
    msgDiv.style.maxWidth = '85%';
    msgDiv.style.wordBreak = 'break-word';
  } else {
    msgDiv.style.alignSelf = 'flex-start';
    msgDiv.style.background = 'rgba(255,255,255,0.06)';
    msgDiv.style.padding = '0.5rem 0.75rem';
    msgDiv.style.borderRadius = '10px';
    msgDiv.style.borderBottomLeftRadius = '2px';
    msgDiv.style.fontSize = '0.8rem';
    msgDiv.style.lineHeight = '1.4';
    msgDiv.style.color = '#cbd5e1';
    msgDiv.style.maxWidth = '85%';
    msgDiv.style.wordBreak = 'break-word';
  }

  msgDiv.innerHTML = role === 'ai' && typeof renderMarkdown === 'function' 
    ? renderMarkdown(text) 
    : text.replace(/\n/g, '<br>');

  chatArea.appendChild(msgDiv);
  chatArea.scrollTop = chatArea.scrollHeight;
  pdfChatHistory.push({ role, text });
}

// Background Pre-fetch PDF Text & Knowledge Base
window.preloadedPdfText = "";
window.resourceKnowledgeMd = "";

async function backgroundPreFetchDocumentKnowledge() {
  // 1. Pre-extract PDF text in background
  if (pdfDoc && !window.preloadedPdfText) {
    try {
      window.preloadedPdfText = await extractPdfText();
    } catch (e) {
      console.warn("Background PDF text pre-fetch warning:", e);
    }
  }

  // 2. Pre-fetch resource knowledge from Firestore if docId exists
  if (docId && docId !== '—' && !window.resourceKnowledgeMd) {
    try {
      const db = window.dpgDb;
      if (db && window.doc && window.getDoc) {
        const snap = await window.getDoc(window.doc(db, "resource_knowledge", docId));
        if (snap && snap.exists()) {
          const kData = snap.data();
          window.resourceKnowledgeMd = kData.knowledgeMd || "";
        }
      }
    } catch (e) {
      console.warn("Background resource_knowledge pre-fetch warning:", e);
    }
  }
}

async function extractPdfText() {
  if (!pdfDoc) return "";
  let text = "";
  const maxPages = Math.min(pdfDoc.numPages, 10);
  for (let i = 1; i <= maxPages; i++) {
    try {
      const page = await pdfDoc.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(" ");
      text += `--- Page ${i} ---\n${pageText}\n\n`;
    } catch(e) {
      console.warn("Failed to extract page " + i, e);
    }
  }
  return text;
}

async function animateProgressSteps(statusElement, steps) {
  for (const step of steps) {
    if (statusElement) {
      statusElement.innerHTML = `🤖 <em>${step}</em>`;
    }
    await new Promise(r => setTimeout(r, 220));
  }
}

async function runAI() {
  const btn = document.getElementById('aiBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ri-loader-4-line" style="animation:spin 1s linear infinite"></i> Analysing...';
  
  const chatArea = document.getElementById("aiChatArea");
  const thinking = document.createElement("div");
  thinking.id = "pdfThinking";
  thinking.style.alignSelf = 'flex-start';
  thinking.style.color = '#a78bfa';
  thinking.style.fontSize = '0.8rem';
  chatArea.appendChild(thinking);
  chatArea.scrollTop = chatArea.scrollHeight;

  const steps = [
    "[ 1/7. Receive Query ]",
    "[ 2/7. Analyzing Document Metadata ]",
    "[ 3/7. Background DOM & PDF Screening ]",
    "[ 4/7. URL Mapping & Resource Indexing ]",
    "[ 5/7. Fetching content from runtime knowledge.md ]",
    "[ 6/7. Generating Response ]",
    "[ 7/7. Formatting Response ]"
  ];

  await backgroundPreFetchDocumentKnowledge();
  await animateProgressSteps(thinking, steps);

  try {
    const res = await fetch(window.API_BASE_URL + '/api/ai/analyse-document', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ 
        data: { 
          docid: docId, 
          title: docTitle, 
          category: docCat, 
          discipline: docDisc, 
          uploader: docUp, 
          description: docDesc, 
          tags: docTags, 
          pdfUrl: pdfUrl,
          extractedPdfText: window.preloadedPdfText,
          knowledgeMd: window.resourceKnowledgeMd
        } 
      })
    });

    if (thinking) thinking.remove();

    if (!res.ok) throw new Error('Server ' + res.status);
    const j = await res.json();
    const answer = j.report || j.analysis || j.result || j.answer || 'No analysis returned.';
    
    appendPdfChatMessage('ai', answer);
  } catch(err) {
    if (thinking) thinking.remove();
    appendPdfChatMessage('ai', '❌ Failed to analyze document: ' + err.message);
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ri-sparkling-line"></i> Re-Analyse';
}
window.runAI = runAI;

async function sendPdfAiQuery() {
  const input = document.getElementById("aiChatInput");
  const btn = document.getElementById("aiChatSendBtn");
  if (!input || !btn) return;
  
  const question = input.value.trim();
  if (!question) return;

  input.value = "";
  btn.disabled = true;
  
  appendPdfChatMessage('user', question);
  
  const chatArea = document.getElementById("aiChatArea");
  const thinking = document.createElement("div");
  thinking.id = "pdfThinking";
  thinking.style.alignSelf = 'flex-start';
  thinking.style.color = '#a78bfa';
  thinking.style.fontSize = '0.8rem';
  chatArea.appendChild(thinking);
  chatArea.scrollTop = chatArea.scrollHeight;

  const steps = [
    "[ 1/7. Receive Query ]",
    "[ 2/7. Analyzing User Question ]",
    "[ 3/7. Background DOM & PDF Screening ]",
    "[ 4/7. URL Mapping & Resource Indexing ]",
    "[ 5/7. Fetching content from runtime knowledge.md ]",
    "[ 6/7. Generating Response ]",
    "[ 7/7. Formatting Response ]"
  ];

  await backgroundPreFetchDocumentKnowledge();
  await animateProgressSteps(thinking, steps);

  try {
    const res = await fetch(window.API_BASE_URL + '/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        history: pdfChatHistory,
        question: question,
        prompt: question,
        resourceId: docId,
        context: {
          documentId: docId,
          documentTitle: docTitle,
          documentCategory: docCat,
          documentDiscipline: docDisc,
          documentUploader: docUp,
          documentDescription: docDesc,
          documentTags: docTags,
          documentPdfUrl: pdfUrl,
          extractedPdfText: window.preloadedPdfText || "N/A",
          knowledgeBase: window.resourceKnowledgeMd || ""
        }
      })
    });
    
    if (thinking) thinking.remove();

    const data = await res.json();
    if (data.answer) {
      appendPdfChatMessage('ai', data.answer);
    } else {
      appendPdfChatMessage('ai', '⚠️ No response received.');
    }
  } catch(err) {
    if (thinking) thinking.remove();
    appendPdfChatMessage('ai', '❌ Connection error: ' + err.message);
  }
  btn.disabled = false;
}
window.sendPdfAiQuery = sendPdfAiQuery;

// ─ Share ────────────────────────────────────────────────────────────────────
async function sharePdf() {
  try {
    const res = await fetch(window.API_BASE_URL + '/api/share/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ docId, title:docTitle, category:docCat, discipline:docDisc, uploader:docUp, pdfUrl, description:docDesc, tags:docTags, originalUrl: location.origin + '/index.html', uploaderUid:'' })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error||'Failed');
    if (navigator.share) await navigator.share({title: `${docTitle} — DPGNotes`, url: data.shareUrl}).catch(()=>{});
    else { await navigator.clipboard.writeText(data.shareUrl); alert('Share link copied:\n' + data.shareUrl); }
  } catch(err) { alert('Share error: ' + err.message); }
}
window.sharePdf = sharePdf;

async function resolveAndRender() {
  // If resourceID is provided in URL, fetch complete real-time document data from Firestore
  if (resourceId && resourceId !== '—') {
    try {
      const db = window.dpgDb;
      if (db && window.doc && window.getDoc) {
        const docRef = window.doc(db, "documents", resourceId);
        const snap = await window.getDoc(docRef);
        if (snap && snap.exists()) {
          const d = snap.data();
          if (d.pdfUrl) pdfUrl = d.pdfUrl;
          if (d.title) docTitle = d.title;
          if (d.category) docCat = d.category;
          if (d.discipline) docDisc = d.discipline;
          if (d.userName || d.uploader) docUp = d.userName || d.uploader;
          if (d.description) docDesc = d.description;
          if (d.tags) docTags = Array.isArray(d.tags) ? d.tags.join(', ') : d.tags;
          docId = snap.id;
        }
      }
    } catch(err) {
      console.warn("Firestore resourceID fetch error, using URL params fallback:", err);
    }
  }

  updateDocMetadataUI();
  await renderAllPages();
}

// ─ Init ─────────────────────────────────────────────────────────────────────
resolveAndRender();

const urlParams = new URLSearchParams(window.location.search);
const q = urlParams.get('q');
if (q) {
  const input = document.getElementById("aiChatInput");
  if (input) {
    input.value = decodeURIComponent(q);
    sendPdfAiQuery();
  }
}
