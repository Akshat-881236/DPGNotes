<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-adsense-account" content="ca-pub-5515547448097504">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5515547448097504" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | DPGNotes SERP</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="custom-dialogs.js"></script>
  <script src="native-dpgnotes-ads.js?v=1.0.0"></script>
  
  <style>
    :root {
      --bg-top: #0a0e17;
      --bg-bottom: #02060f;
      --surface: rgba(15, 23, 42, 0.6);
      --surface-hover: rgba(30, 41, 59, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-light: #8b5cf6;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      --radius-sm: 12px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    .serp-header {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 100;
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
    }

    .brand-link {
      display: flex; align-items: center; gap: 0.8rem;
      text-decoration: none; color: white;
    }
    .brand-logo {
      width: 42px; height: 42px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.25rem;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 800;
    }

    .search-input-wrapper {
      flex: 1; max-width: 600px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.5rem;
      display: flex; align-items: center; gap: 0.5rem;
      transition: border-color 0.2s;
    }
    .search-input-wrapper:focus-within {
      border-color: var(--primary);
    }
    .search-input-wrapper i {
      color: var(--primary-light); margin-left: 0.8rem;
    }
    .search-input-wrapper input {
      flex: 1; border: none; outline: none; background: transparent;
      color: white; font-family: inherit; font-size: 0.95rem; padding: 0.5rem 0.2rem;
    }

    /* Layout Split */
    .serp-body {
      display: flex; flex: 1; width: 100%; max-width: 1400px; margin: 0 auto;
      padding: 2rem; gap: 2rem;
    }

    /* Left Filters panel */
    .filters-sidebar {
      width: 280px; flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem; height: fit-content;
      position: sticky; top: 90px;
    }
    .filter-group { margin-bottom: 1.8rem; }
    .filter-title {
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700;
      color: white; margin-bottom: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .filter-select {
      width: 100%; padding: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: white; font-family: inherit; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .filter-select:focus { border-color: var(--primary); }

    /* Right Results List */
    .results-section { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; }
    .results-info {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;
    }
    .results-info strong { color: white; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.6rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .result-card:hover {
      transform: translateY(-3px);
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .result-content { flex: 1; }
    .result-category {
      display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px;
      background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      margin-bottom: 0.8rem; border: 1px solid rgba(99, 102, 241, 0.25);
    }
    .result-title {
      font-size: 1.25rem; font-weight: 700; color: white; margin-bottom: 0.5rem;
    }
    .result-desc {
      color: var(--text-muted); font-size: 0.92rem; line-height: 1.6;
      margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .result-meta {
      display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.8rem; color: var(--text-muted);
    }
    .result-meta span { display: flex; align-items: center; gap: 4px; }

    .result-visit-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; text-decoration: none;
      transition: all 0.3s; flex-shrink: 0;
    }
    .result-card:hover .result-visit-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; transform: translateX(3px) scale(1.05);
      box-shadow: 0 4px 15px var(--primary-glow);
      border-color: transparent;
    }

    .no-results-panel {
      text-align: center; padding: 4rem 2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-muted);
    }
    .no-results-panel i { font-size: 4rem; color: var(--primary-light); margin-bottom: 1.5rem; display: block; }
    .no-results-panel h3 { color: white; font-family: 'Outfit', sans-serif; margin-bottom: 0.5rem; }

    /* Responsiveness */
    @media (max-width: 768px) {
      .serp-header { padding: 1rem; }
      .serp-body { flex-direction: column; padding: 1rem; gap: 1rem; }
      .filters-sidebar { width: 100%; position: relative; top: 0; }
      .brand-title { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="serp-header">
    <a href="/dpgnotes-search-engine.html" class="brand-link">
      <div class="brand-logo">D</div>
      <span class="brand-title">DPGNotes</span>
    </a>
    <div class="search-input-wrapper">
      <i class="ri-search-line"></i>
      <input type="text" id="serpSearchField" placeholder="Search sessional notes...">
    </div>
  </header>

  <!-- Google-Style 6-Tab Navigation Bar -->
  <nav class="serp-tabs-bar" style="display:flex; gap:16px; background:rgba(15,23,42,0.85); border-bottom:1px solid var(--border); padding:0 2rem; overflow-x:auto; backdrop-filter:blur(10px);">
    <button class="serp-tab-btn active" id="tab-btn-all" onclick="window.switchSerpTab('all')" style="background:none; border:none; color:#818cf8; border-bottom:3px solid #818cf8; padding:0.75rem 0.5rem; font-weight:700; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-search-2-line"></i> All
    </button>
    <button class="serp-tab-btn" id="tab-btn-ai" onclick="window.switchSerpTab('ai')" style="background:none; border:none; color:#94a3b8; padding:0.75rem 0.5rem; font-weight:600; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-sparkling-fill" style="color:#c084fc;"></i> AI Overview
    </button>
    <button class="serp-tab-btn" id="tab-btn-sponsored" onclick="window.switchSerpTab('sponsored')" style="background:none; border:none; color:#94a3b8; padding:0.75rem 0.5rem; font-weight:600; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-megaphone-line" style="color:#f59e0b;"></i> Sponsored
    </button>
    <button class="serp-tab-btn" id="tab-btn-image" onclick="window.switchSerpTab('image')" style="background:none; border:none; color:#94a3b8; padding:0.75rem 0.5rem; font-weight:600; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-image-line" style="color:#38bdf8;"></i> Images
    </button>
    <button class="serp-tab-btn" id="tab-btn-videos" onclick="window.switchSerpTab('videos')" style="background:none; border:none; color:#94a3b8; padding:0.75rem 0.5rem; font-weight:600; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-youtube-line" style="color:#ef4444;"></i> Videos
    </button>
    <button class="serp-tab-btn" id="tab-btn-website" onclick="window.switchSerpTab('website')" style="background:none; border:none; color:#94a3b8; padding:0.75rem 0.5rem; font-weight:600; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <i class="ri-global-line" style="color:#10b981;"></i> Websites
    </button>
  </nav>

  <!-- Top Header Native Sponsored Ad Banner -->
  <div class="native-ads" data-ad-variant="header" data-ad-count="1" style="max-width:1200px; margin:0.5rem auto; padding:0 1rem; box-sizing:border-box;"></div>

  <!-- Body -->
  <div class="serp-body">
    <!-- Left Filters Panel -->
    <aside class="filters-sidebar">
      <div class="filter-group">
        <h4 class="filter-title">Document Category</h4>
        <select class="filter-select" id="filterCategory" onchange="applyFilters()">
          <option value="ALL">Loading Categories...</option>
        </select>
      </div>

      <div class="filter-group">
        <h4 class="filter-title">Discipline</h4>
        <select class="filter-select" id="filterDiscipline" onchange="applyFilters()">
          <option value="ALL">Loading Disciplines...</option>
        </select>
      </div>

      <div class="filter-group">
        <h4 class="filter-title">Sort By</h4>
        <select class="filter-select" id="sortOrder" onchange="applyFilters()">
          <option value="newest">Newest First</option>
          <option value="likes">Most Liked</option>
          <option value="title">Alphabetical</option>
        </select>
      </div>

      <div class="native-ads" id="native-ads-sidebar" style="margin-top:1.5rem;"></div>
    </aside>

    <!-- Right Results Panel -->
    <main class="results-section">
      <div class="native-ads" id="native-ads-serp" style="margin-bottom:1rem;"></div>
      <div class="results-info">
        <span>Showing <strong id="resultsCount">0</strong> results for query "<strong id="queryText"></strong>"</span>
      </div>

      <div id="resultsList" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Dynamic Result Cards -->
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClhxuoGf7ELHD0srUBUPyQM6_CvYNafIE",
      authDomain: "dpgnotes.firebaseapp.com",
      projectId: "dpgnotes",
      storageBucket: "dpgnotes.firebasestorage.app",
      measurementId: "G-VDF1GNVCQ4",
      appId: "1:910494426039:web:adeae5315caaf846c43e32"
    };

    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDocs = [];

    // Parse URL Parameter
    const urlParams = new URLSearchParams(window.location.search);
    const searchField = document.getElementById("serpSearchField");
    const queryTextSpan = document.getElementById("queryText");

    const initialQuery = urlParams.get("q") || urlParams.get("query") || "";
    if (searchField) searchField.value = initialQuery;
    if (queryTextSpan) queryTextSpan.innerText = initialQuery;

    function populateDynamicFilters() {
      const catSelect = document.getElementById("filterCategory");
      const discSelect = document.getElementById("filterDiscipline");
      if (!catSelect || !discSelect) return;

      // Extract unique categories and disciplines from document list
      const uniqueCats = [...new Set(allDocs.map(d => d.category).filter(Boolean))].sort();
      const uniqueDiscs = [...new Set(allDocs.map(d => d.discipline).filter(Boolean))].sort();

      // Static pool of standard categories matching index.html
      const defaultCats = {
        "SE": "Sessional Exam (SE)",
        "SP": "Sample Paper (SP)",
        "UE": "University Exam (UE)",
        "EV": "Event Materials (EV)",
        "T&N": "Tutorial & Notes (T&N)",
        "IQ": "Interview Questions (IQ)",
        "A&LR": "Aptitude & Logical Reasoning (A&LR)",
        "PQ": "Placement Questions (PQ)"
      };

      // 1. Populate Category dropdown (Union of default keys and database unique categories)
      catSelect.innerHTML = '<option value="ALL">All Categories</option>';
      const finalCats = new Set([...Object.keys(defaultCats), ...uniqueCats]);
      finalCats.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = defaultCats[cat] || cat;
        catSelect.appendChild(opt);
      });

      // 2. Populate Discipline dropdown dynamically with sorted unique entries
      discSelect.innerHTML = '<option value="ALL">All Disciplines</option>';
      uniqueDiscs.forEach(disc => {
        const opt = document.createElement("option");
        opt.value = disc;
        opt.innerText = disc;
        discSelect.appendChild(opt);
      });
    }

    // Load Documents & filter
    window.activeSerpTab = 'all';
    window.currentSearchResults = [];

    window.switchSerpTab = function(tabName) {
      window.activeSerpTab = tabName;
      document.querySelectorAll('.serp-tab-btn').forEach(btn => {
        btn.style.color = '#94a3b8';
        btn.style.borderBottom = 'none';
        btn.style.fontWeight = '600';
      });
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      if (activeBtn) {
        activeBtn.style.color = '#818cf8';
        activeBtn.style.borderBottom = '3px solid #818cf8';
        activeBtn.style.fontWeight = '700';
      }
      renderActiveTabContent();
    };

    window.applyFilters = function() {
      const q = searchField.value.trim().toLowerCase();
      queryTextSpan.innerText = searchField.value;

      const catFilter = document.getElementById("filterCategory").value;
      const discFilter = document.getElementById("filterDiscipline").value;
      const sortBy = document.getElementById("sortOrder").value;

      // 1. Multi-field Text Search filtering with keyword tokens
      let results = allDocs;
      if (q) {
        const tokens = q.split(/\s+/).filter(Boolean);
        const matched = results.filter(d => {
          const title = (d.title || "").toLowerCase();
          const desc = (d.description || "").toLowerCase();
          const disc = (d.discipline || "").toLowerCase();
          const cat = (d.category || "").toLowerCase();
          const uploader = (d.userName || d.uploader || "").toLowerCase();
          const docId = (d.documentId || d.id || "").toLowerCase();
          const tags = Array.isArray(d.tags) ? d.tags.join(" ").toLowerCase() : (d.tags || "").toLowerCase();

          const combined = `${title} ${desc} ${disc} ${cat} ${uploader} ${docId} ${tags}`;
          return tokens.some(token => combined.includes(token)); // Flexible multi-token matching
        });

        if (matched.length > 0) {
          results = matched;
        } else {
          // Multi-field AI Fallback: Return all documents sorted by SERP priority score
          results = allDocs;
        }
      }

      // 2. Category Dropdown Filter
      if (catFilter !== "ALL") {
        const cFiltered = results.filter(d => (d.category || "").toLowerCase().includes(catFilter.toLowerCase()));
        if (cFiltered.length > 0) results = cFiltered;
      }

      // 3. Discipline Dropdown Filter
      if (discFilter !== "ALL") {
        const dFiltered = results.filter(d => (d.discipline || "").toLowerCase().includes(discFilter.toLowerCase()));
        if (dFiltered.length > 0) results = dFiltered;
      }

      // 4. Advanced High Priority SERP Ranking Algorithm
      results.forEach(d => {
        const lCount = Array.isArray(d.likes) ? d.likes.length : (d.likes || 0);
        const sCount = d.sharesCount || 0;
        const vCount = d.views || 1;
        const stMins = Math.round((d.screentime || 60) / 60);
        const relScore = q ? (((d.title || "").toLowerCase().includes(q) || (d.category || "").toLowerCase().includes(q) || (d.discipline || "").toLowerCase().includes(q)) ? 10 : 4) : 1;
        d.priorityScore = (lCount * 5) + (sCount * 4) + (stMins * 3) + (vCount * 2) + (relScore * 10);
      });

      if (sortBy === "newest") {
        results.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      } else if (sortBy === "likes") {
        results.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (sortBy === "title") {
        results.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      } else {
        results.sort((a, b) => (b.priorityScore || 0) - (a.priorityScore || 0));
      }

      window.currentSearchResults = results;
      renderActiveTabContent();
    };

    function renderActiveTabContent() {
      const results = window.currentSearchResults || [];
      const list = document.getElementById("resultsList");
      const countLabel = document.getElementById("resultsCount");
      countLabel.innerText = results.length;

      if (!list) return;

      const q = searchField.value.trim();

      // ==========================================
      // TAB 1: ALL (Standard Ranked Results)
      // ==========================================
      if (window.activeSerpTab === 'all') {
        if (results.length === 0) {
          list.innerHTML = `
            <div class="no-results-panel" style="background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:2.5rem; text-align:center;">
              <i class="ri-search-eye-line" style="font-size:3rem; color:var(--primary-light); margin-bottom:1rem; display:block;"></i>
              <h3 style="font-size:1.3rem; margin-bottom:0.5rem; color:white;">No results matched your query</h3>
              <p style="color:var(--text-muted); font-size:0.92rem; max-width:480px; margin:0 auto 1.5rem;">Try broadening your terms, selecting another academic category, or checking spelling.</p>
            </div>
          `;
          return;
        }

        let html = `
          <div class="google-ai-overview" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.08)); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 18px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; position: relative;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.88rem; color: #a78bfa;">
                <i class="ri-sparkling-fill" style="color: #c084fc; font-size: 1.1rem;"></i> DPGNotes AI Synthesis
              </div>
              <span style="font-size: 0.72rem; background: rgba(139, 92, 246, 0.2); color: #c4b5fd; padding: 2px 8px; border-radius: 12px; font-weight: 600;">SERP Auto-Ranked</span>
            </div>
            <p style="font-size: 0.9rem; color: #e2e8f0; line-height: 1.6; margin-bottom: 0.75rem;">
              Found <strong>${results.length} academic resources</strong> for query "<em>${q || 'all files'}</em>". Highest priority score match: <strong>"${results[0].title}"</strong> (${results[0].category} / ${results[0].discipline}).
            </p>
          </div>
        `;
        list.innerHTML = html;

        results.forEach((d, idx) => {
          const likesCount = Array.isArray(d.likes) ? d.likes.length : (d.likes || 0);
          const tagsString = Array.isArray(d.tags) ? d.tags.join(", ") : (d.tags || "");
          const viewerUrl = `/dpgnotes-pdf-viewer.html?pdf=${encodeURIComponent(d.pdfUrl || '')}&title=${encodeURIComponent(d.title || '')}&category=${encodeURIComponent(d.category || '')}&discipline=${encodeURIComponent(d.discipline || '')}&uploader=${encodeURIComponent(d.userName || d.uploader || 'Contributor')}&docid=${encodeURIComponent(d.id)}&trackId=${d.trackId || ''}&description=${encodeURIComponent(d.description || '')}&tags=${encodeURIComponent(tagsString)}&search-token=SERP`;

          const card = document.createElement("article");
          card.className = "result-card";
          card.style.cssText = "background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.5rem; margin-bottom:1rem; transition:all 0.2s;";
          card.innerHTML = `
            <div class="result-content">
              <div style="display:flex; align-items:center; gap:8px; font-size:0.78rem; color:#94a3b8; margin-bottom:0.35rem;">
                <span style="width:18px; height:18px; border-radius:50%; background:linear-gradient(135deg, #6366f1, #8b5cf6); display:inline-flex; align-items:center; justify-content:center; color:white; font-size:0.65rem; font-weight:800;">D</span>
                <span>dpgnotes.web.app › ${d.category || 'notes'} › ${d.discipline || 'academic'}</span>
              </div>
              <h2 class="result-title" style="margin-bottom:0.4rem;">
                <a href="${viewerUrl}" style="color:#818cf8; text-decoration:none; font-family:'Outfit', sans-serif; font-size:1.15rem; font-weight:700;">${d.title}</a>
              </h2>
              <p class="result-desc" style="color:#cbd5e1; font-size:0.88rem; line-height:1.55; margin-bottom:0.75rem;">${d.description || "Sessional notes and academic study resource."}</p>
              <div class="result-meta" style="display:flex; align-items:center; gap:1rem; font-size:0.78rem; color:#94a3b8; flex-wrap:wrap;">
                <span style="background:rgba(99, 102, 241, 0.15); color:#a78bfa; padding:2px 8px; border-radius:12px; font-weight:600;">📁 ${d.category}</span>
                <span>📘 ${d.discipline}</span>

          rkSnap.forEach(rkDoc => {
            const rk = rkDoc.data();
            if (Array.isArray(rk.urls)) window.knowledgeUrlsCache.push(...rk.urls);
          });
        } catch(e) { console.warn("Resource knowledge fetch failed", e); }

        // Fetch user_ads Thumbnails (Image 3)
        window.approvedAdsCache = [];
        try {
          const adsSnap = await getDocs(collection(db, "user_ads"));
          adsSnap.forEach(adDoc => {
            const ad = adDoc.data();
            if (ad.status === "Approved") window.approvedAdsCache.push({ id: adDoc.id, ...ad });
          });
        } catch(e) { console.warn("User ads fetch failed", e); }

        populateDynamicFilters();
        applyFilters();
      } catch (err) {
        console.error("Failed downloading documents:", err);
      }
    }

    // Load initial documents from Firestore
    loadDocuments();
  </script>

  <!-- DPGNotes Gallery Lightbox Modal -->
  <div id="dpgGalleryModal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(15,23,42,0.96); backdrop-filter:blur(12px); flex-direction:column; justify-content:space-between; padding:1.5rem;">
    <!-- Modal Header: Top-Left Cross Icon (✖) & Counter -->
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="closeDpgGalleryModal()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; font-size:1.4rem; border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700;" title="Close Gallery (Esc)">✖</button>
      <span id="galleryModalTitle" style="color:#c084fc; font-weight:700; font-size:0.95rem;">DPGNotes Gallery Viewer</span>
      <span id="galleryModalCounter" style="color:#94a3b8; font-size:0.85rem; font-weight:600;">1 of 1</span>
    </div>

    <!-- Modal Content: Prev Button, Main Image, Next Button -->
    <div id="gallerySwipeContainer" style="display:flex; align-items:center; justify-content:space-between; gap:1rem; flex:1; margin:1rem 0; touch-action:pan-y;">
      <button onclick="prevGalleryImage()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; font-size:1.8rem; border-radius:50%; width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Previous Image (Left Arrow)">◀</button>
      
      <div style="text-align:center; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; max-height:78vh;">
        <img id="galleryModalImage" src="ANH.png" style="max-width:100%; max-height:65vh; object-fit:contain; border-radius:14px; border:1px solid rgba(255,255,255,0.15); box-shadow:0 20px 50px rgba(0,0,0,0.8);" alt="Gallery Image">
        <p id="galleryModalCaption" style="color:white; font-size:0.88rem; margin-top:12px; font-weight:600;"></p>
      </div>

      <button onclick="nextGalleryImage()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; font-size:1.8rem; border-radius:50%; width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Next Image (Right Arrow)">▶</button>
    </div>

    <!-- Modal Footer: Bottom-Left Close Button -->
    <div style="display:flex; justify-content:flex-start;">
      <button onclick="closeDpgGalleryModal()" style="background:#ef4444; border:none; color:white; padding:8px 18px; border-radius:10px; font-weight:700; font-size:0.88rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
        <i class="ri-close-line"></i> Close
      </button>
    </div>
  </div>

  <!-- Bottom Footer Native Sponsored Ad Banner -->
  <div class="native-ads" data-ad-variant="footer" data-ad-count="1" style="max-width:1200px; margin:2rem auto 1rem auto; padding:0 1rem; box-sizing:border-box;"></div>

  <script src="redirect.js"></script>
</body>
</html>
