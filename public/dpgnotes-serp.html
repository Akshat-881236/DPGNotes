  <style>
    :root {
      --bg: #ffffff;
      --bg-surface: #f8fafc;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dfe1e5;
      --border-subtle: #f1f3f4;
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --primary-light: #e8f0fe;
      --link-blue: #1a0dab;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 24px;
      --shadow-sm: 0 1px 3px rgba(32,33,36,0.1);
      --shadow-md: 0 4px 12px rgba(32,33,36,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* =======================================================
       STICKY TOP SERP HEADER (MATCHING IMAGE 5)
       ======================================================= */
    .serp-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .serp-brand-link {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--primary);
      flex-shrink: 0;
    }
    .serp-brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .serp-brand-fallback-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
    }
    .serp-brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .serp-search-container {
      flex: 1;
      max-width: 680px;
      position: relative;
    }

    .serp-search-wrapper {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.3rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 1px 6px rgba(32,33,36,0.15);
      transition: all 0.2s ease;
    }
    .serp-search-wrapper:hover,
    .serp-search-wrapper:focus-within {
      box-shadow: 0 2px 8px rgba(32,33,36,0.22);
      border-color: #bdc1c6;
    }

    .serp-search-icon {
      color: #9aa0a6;
      font-size: 1.15rem;
      margin-left: 0.5rem;
      flex-shrink: 0;
    }

    .serp-search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.98rem;
      padding: 0.5rem 0.2rem;
    }

    .serp-search-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-right: 0.4rem;
      flex-shrink: 0;
    }
    .serp-action-btn {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 1.15rem;
      padding: 4px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .serp-action-btn:hover {
      background: #f1f3f4;
      color: var(--text);
    }
    .serp-mic-btn {
      color: #ea4335 !important;
    }
    .serp-mic-btn.listening {
      animation: micPulse 1.2s infinite;
      background: #fce8e6;
    }

    /* Top Right Auth & Navigation Controls */
    .serp-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .serp-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #3c4043;
      border: 1px solid #dadce0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .serp-home-btn:hover {
      background: #f8fafc;
      border-color: #bdc1c6;
      color: #202124;
    }

    .nav-btn-signin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn-signin:hover {
      background: var(--primary-hover);
    }

    .contributor-user-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .contributor-dashboard-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      padding: 4px 14px 4px 5px;
      border-radius: 22px;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .contributor-dashboard-btn:hover {
      background: var(--primary-hover);
    }
    .contributor-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #2563eb;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      overflow: hidden;
      flex-shrink: 0;
    }
    .contributor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contributor-logout-btn {
      background: #f8fafc;
      border: 1px solid #dadce0;
      color: #5f6368;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .contributor-logout-btn:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    /* =======================================================
       HORIZONTAL TABS NAVIGATION BAR (MATCHING IMAGE 5)
       All Results | AI Overview | Websites | YouTube Videos | Academic Solutions | Contributors
       ======================================================= */
    .serp-tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 1.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: sticky;
      top: 59px;
      z-index: 90;
      white-space: nowrap;
    }
    .serp-tabs-bar::-webkit-scrollbar { display: none; }

    @media (min-width: 900px) {
      .serp-tabs-bar {
        justify-content: center;
      }
    }

    .serp-tab-btn {
      background: none;
      border: none;
      color: #5f6368;
      border-bottom: 3px solid transparent;
      padding: 0.75rem 0.9rem;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .serp-tab-btn:hover {
      color: #202124;
      background: #f8fafc;
    }
    .serp-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* =======================================================
       SUBHEADER RESULTS META & SORT BAR (MATCHING IMAGE 5)
       ======================================================= */
    .serp-meta-bar {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 0.85rem 1.5rem 0.4rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .serp-results-count {
      font-size: 0.86rem;
      color: #70757a;
    }
    .serp-results-count strong {
      color: #202124;
    }

    .serp-sort-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .serp-sort-select {
      border: 1px solid #dadce0;
      background: #ffffff;
      color: #3c4043;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    /* Toggle Filters Button */
    .serp-filter-toggle-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      color: #3c4043;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .serp-filter-toggle-btn:hover {
      background: #f8fafc;
      border-color: #bdc1c6;
    }

    /* Collapsible Filter Panel */
    .serp-filter-panel {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 0.5rem 1.5rem 1rem 1.5rem;
      display: none;
    }
    .serp-filter-panel.open {
      display: block;
    }

    .serp-filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      align-items: center;
    }
    .serp-filter-col select {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-size: 0.84rem;
      font-family: inherit;
      outline: none;
    }
    .serp-filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-top: 8px;
    }
    .serp-filter-chip {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .serp-filter-chip.active {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
      font-weight: 600;
    }

    /* =======================================================
       MAIN RESULTS STAGE & LOADING STATE (IMAGE 5)
       ======================================================= */
    .serp-main-wrapper {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem 1.5rem 3rem 1.5rem;
      flex: 1;
    }

    /* Clean Image 5 Circular Blue Loading Spinner */
    .serp-loading-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
      gap: 16px;
      width: 100%;
      text-align: center;
    }
    .serp-loading-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: serpSpin 0.75s linear infinite;
    }
    @keyframes serpSpin {
      to { transform: rotate(360deg); }
    }
    .serp-loading-text {
      font-size: 0.95rem;
      color: #5f6368;
      font-weight: 500;
    }
    .serp-loading-text span {
      color: #202124;
      font-weight: 600;
    }

    /* =======================================================
       RESULT CARDS (CLEAN GOOGLE STYLE)
       ======================================================= */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
      max-width: 900px;
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.35rem 1.6rem;
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.03);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .result-card:hover {
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.09), 0 6px 12px -3px rgba(15, 23, 42, 0.04);
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }

    /* Breadcrumb Domain Header */
    .result-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      width: 100%;
    }
    .result-domain-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1a73e8;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .result-domain-info {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    .result-domain-name {
      font-weight: 600;
      font-size: 0.82rem;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-breadcrumb-url {
      font-size: 0.76rem;
      color: #64748b;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: break-all;
    }
    .result-author-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .result-author-link:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }

    .result-verified-pill {
      margin-left: auto;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 3px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Title Link */
    .result-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin: 4px 0 6px 0;
      line-height: 1.36;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .result-title a {
      color: #0f172a;
      text-decoration: none;
      transition: color 0.15s;
    }
    .result-title a:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* Description Snippet */
    .result-snippet {
      font-size: 0.92rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 0.85rem;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Card Footer & Action Buttons */
    .result-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
      margin-top: 6px;
    }
    .result-tags-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .result-tag {
      background: #f1f5f9;
      color: #475569;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .result-metric-tag {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #e2e8f0;
      font-weight: 600;
    }
    .result-metric-tag i.ri-heart-3-fill {
      color: #ef4444;
    }
    .result-metric-tag i.ri-share-forward-fill {
      color: #3b82f6;
    }

    .result-btn-open {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 5px rgba(37,99,235,0.22);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .result-btn-open:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(37,99,235,0.32);
      color: #ffffff;
    }

    /* =======================================================
       AI OVERVIEW TAB & INTERACTIVE CHAT ENGINE
       ======================================================= */
    .ai-hero-card {
      background: #ffffff;
      border: 1px solid #e9d5ff;
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.08);
      margin-bottom: 1.5rem;
    }
    .ai-hero-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid #f3e8ff;
    }
    .ai-sparkle-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #f3e8ff, #e0e7ff);
      color: #7c3aed;
      border: 1px solid #ddd6fe;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .ai-hero-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.28rem;
      font-weight: 700;
      color: #1e1b4b;
      margin: 4px 0 0 0;
    }
    .ai-header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-key-config-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .ai-key-config-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .ai-clear-chat-btn {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #e11d48;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* AI Chat Card */
    .ai-chat-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .ai-chat-feed {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0.5rem 0;

<body>

  <!-- Top SERP Navigation Header (Matching Image 5) -->

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, getDocs, collectionGroup, doc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClhxuoGf7ELHD0srUBUPyQM6_CvYNafIE",
      authDomain: "dpgnotes.firebaseapp.com",
      projectId: "dpgnotes",
      storageBucket: "dpgnotes.firebasestorage.app",
      measurementId: "G-VDF1GNVCQ4",
      appId: "1:910494426039:web:adeae5315caaf846c43e32"
    };

    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const apiBase = (typeof window.API_BASE_URL === 'string' && window.API_BASE_URL !== 'undefined') ? window.API_BASE_URL : (window.RENDER_BACKEND_URL || 'https://dpgnotes.onrender.com');

    // ==========================================
    // AUTH STATE & NAVBAR
    // ==========================================
    onAuthStateChanged(auth, (user) => {
      const authArea = document.getElementById("navAuthArea");
      if (!authArea) return;

      if (user) {
        const photoURL = user.photoURL || '';
        const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'Contributor');
        const initial = displayName.charAt(0).toUpperCase();

        const avatarHtml = photoURL 
          ? `<img src="${photoURL}" alt="${displayName}" onerror="this.onerror=null; this.parentNode.innerText='${initial}';">`
          : initial;

        authArea.innerHTML = `
          <div class="contributor-user-wrapper">
            <a href="dashboard.html" class="contributor-dashboard-btn" title="Contributor Dashboard (${displayName})">
              <div class="contributor-avatar">${avatarHtml}</div>
              <span class="dashboard-label-text">Dashboard</span>
            </a>
            <button type="button" class="contributor-logout-btn" onclick="window.handleSerpSignOut()" title="Log Out">
              <i class="ri-logout-box-r-line"></i>
            </button>
          </div>
        `;
      } else {
        authArea.innerHTML = `
          <a href="dashboard.html" class="nav-btn-signin" title="Sign In">
            <i class="ri-login-box-line"></i>
            <span>Sign In</span>
          </a>
        `;
      }
    });

    window.handleSerpSignOut = async function() {
      try {
        await signOut(auth);
        localStorage.removeItem("dpgActiveUserUid");
        localStorage.removeItem("dpgActiveUserEmail");
        localStorage.removeItem("dpgActiveUserName");
        window.location.reload();
      } catch (err) {
        console.error("Sign out error:", err);
      }
    };

    // ==========================================
    // QUERY PARAMETERS & STATE
    // ==========================================
    let allDocs = [];
    let allContributors = [];
    window.currentSearchResults = [];
    window.activeSerpTab = 'all';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const searchField = document.getElementById("serpSearchField");
    const queryLabel = document.getElementById("queryTextLabel");
    const initialQuery = urlParams.get("q") || urlParams.get("query") || urlParams.get("tag") || "";

    if (searchField) searchField.value = initialQuery;
    if (queryLabel) queryLabel.innerText = initialQuery || "All Materials";

    const initialTab = urlParams.get("tab");
    if (initialTab && ['all', 'ai', 'website', 'videos', 'solutions', 'contributors'].includes(initialTab.toLowerCase())) {
      window.activeSerpTab = initialTab.toLowerCase();
    } else {
      window.activeSerpTab = 'all';
    }

    window.clearSearchField = function() {
      if (searchField) {
        searchField.value = '';
        searchField.focus();
        applyFilters();
      }
    };

    window.toggleFilterPanel = function() {
      const panel = document.getElementById("serpFilterPanel");
      if (panel) panel.classList.toggle("open");
    };

    // Voice Search
    window.startSerpVoiceSearch = function() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser. Please type your query.");
        return;
      }
      const micBtn = document.getElementById("btnSerpMic");
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();

      if (micBtn) micBtn.classList.add("listening");
      if (searchField) searchField.placeholder = "🎙️ Listening... Speak query now";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (searchField) searchField.value = transcript;
        if (micBtn) micBtn.classList.remove("listening");
        runSearch();
      };
      recognition.onerror = () => {
        if (micBtn) micBtn.classList.remove("listening");
        if (searchField) searchField.placeholder = "Search notes, solutions, PYQs...";
      };
      recognition.onend = () => {
        if (micBtn) micBtn.classList.remove("listening");
      };
    };

    // ==========================================
    // TAB SWITCHING (IMAGE 5)
    // ==========================================
    window.switchSerpTab = function(tabName) {
      if (!['all', 'ai', 'website', 'videos', 'solutions', 'contributors'].includes(tabName)) {
        tabName = 'all';
      }
      window.activeSerpTab = tabName;

      document.querySelectorAll('.serp-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      if (activeBtn) activeBtn.classList.add('active');

      const metaBar = document.getElementById("serpMetaBar");
      if (metaBar) {
        metaBar.style.display = (tabName === 'ai') ? 'none' : 'flex';
      }

      // Update URL silently
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set("tab", tabName);
      window.history.replaceState(null, null, newUrl);

      showLoadingStage();
      setTimeout(() => {
        hideLoadingStage();
        renderActiveTabContent();
      }, 250);
    };

    function showLoadingStage() {
      const stage = document.getElementById("serpLoadingStage");
      const list = document.getElementById("resultsList");
      const q = searchField ? searchField.value.trim() : '';
      const lbl = document.getElementById("loadingQueryLabel");
      if (lbl) lbl.innerText = q || 'Academic Resources';
      if (stage) stage.style.display = 'flex';
      if (list) list.style.display = 'none';
    }

    function hideLoadingStage() {
      const stage = document.getElementById("serpLoadingStage");
      const list = document.getElementById("resultsList");
      if (stage) stage.style.display = 'none';
      if (list) list.style.display = 'flex';
    }

    // ==========================================
    // DATA LOADING & MULTI-COLLECTION MERGE
    // ==========================================
    async function loadDocuments() {
      showLoadingStage();
      try {
        const snap = await getDocs(collection(db, "documents"));
        allDocs = [];
        snap.forEach(d => {
          const data = d.data();
          const isApproved = data.status === "approved" || data.status === "Approved" || data.isApproved === true;
          const isPrivate = data.visibility === "private" || data.isPasswordProtected === true || data.isPublic === false;
          if (isApproved && !isPrivate) {
            allDocs.push({ id: d.id, ...data });
          }
        });

        // Restore Multi-Collection Query: Fetch Academic Solutions (Assignments & Practicals)
        try {
          const solSnap = await getDocs(collectionGroup(db, "solutions"));
          solSnap.forEach(solDoc => {
            const solData = solDoc.data();
            const parentPath = solDoc.ref.path || '';
            const isPractical = parentPath.includes("practical_solutions") || solData.type === "practical" || (solData.id && solData.id.startsWith("prac_"));
            const solType = isPractical ? "Practical Solution" : "Assignment Solution";
            const viewerBase = isPractical ? "PracticalSolution/index.html" : "AssignmentSolution/index.html";
            const contribUid = solData.contributorUid || solData.userId || solData.uid || "";
            const solUrl = `${viewerBase}?id=${encodeURIComponent(solData.id || solDoc.id)}${contribUid ? '&contributor=' + encodeURIComponent(contribUid) : ''}`;

            const subName = solData.subjectName || 'Academic Solution';
            const subCode = solData.subjectCode ? ` (${solData.subjectCode})` : '';
            const course = solData.course || solData.courseSec || "Academic";
            const author = solData.studentName || solData.contributorName || "Verified Contributor";
            const isEnc = Boolean(solData.isEncrypted);
            const likesCount = typeof solData.likes === 'number' ? solData.likes : (Array.isArray(solData.likedBy) ? solData.likedBy.length : (Array.isArray(solData.likes) ? solData.likes.length : 0));
            const sharesCount = typeof solData.shares === 'number' ? solData.shares : (Array.isArray(solData.shares) ? solData.shares.length : (typeof solData.shareCount === 'number' ? solData.shareCount : (solData.views || 0)));

            allDocs.push({
              id: solDoc.id,
              isSolution: true,
              solutionType: isPractical ? "practical" : "assignment",
              solutionUrl: solUrl,
              title: `${subName}${subCode}`,
              subjectName: solData.subjectName || '',
              subjectCode: solData.subjectCode || '',
              category: solType,
              discipline: course,
              description: `${solType} for ${subName}${subCode}. Course: ${course}. Contributor: ${author}. ${isEnc ? '🔐 Password Protected' : '🔓 Public Solution'}.`,
              userName: author,
              uploader: author,
              contributorUid: contribUid,
              uid: contribUid,
              userId: contribUid,
              likes: likesCount,
              shares: sharesCount,
              views: solData.views || 0,
              screentime: solData.totalScreentimeSec || 60,
              isEncrypted: isEnc,
              isVerified: true,
              tags: [isPractical ? "practical" : "assignment", "solution", solData.subjectCode || "", course, isEnc ? "protected" : "public"].filter(Boolean),
              createdAt: solData.createdAt ? (typeof solData.createdAt === 'string' ? { seconds: Math.floor(new Date(solData.createdAt).getTime() / 1000) } : solData.createdAt) : { seconds: Math.floor(Date.now() / 1000) },
              rawDoc: solData
            });
          });
        } catch (solErr) {
          console.warn("Solutions collectionGroup fetch error:", solErr);
        }

        // Fetch registered users for Contributors tab
        try {
          const userSnap = await getDocs(collection(db, "users"));
          const usersMap = new Map();
          userSnap.forEach(uDoc => {
            const uData = uDoc.data();
            const displayName = uData.displayName || uData.name || (uData.email ? uData.email.split('@')[0] : 'Contributor');
            usersMap.set(uDoc.id, {
              uid: uDoc.id,
              name: displayName,
              photoURL: uData.photoURL || uData.profilePic || '',
              role: uData.role || 'Contributor',
              discipline: uData.discipline || 'Academic',
              docsCount: 0,
              likesCount: 0
            });
          });

          // Match docs counts to users
          allDocs.forEach(d => {
            const authorUid = d.contributorUid || d.userId || d.uid || d.uploaderId;
            const author = d.userName || d.uploader || d.studentName || d.contributorName;
            const docLikes = Array.isArray(d.likes) ? d.likes.length : (typeof d.likes === 'number' ? d.likes : (Array.isArray(d.likedBy) ? d.likedBy.length : 0));

            if (authorUid && usersMap.has(authorUid)) {
              const u = usersMap.get(authorUid);
              u.docsCount++;
              u.likesCount += docLikes;
            } else if (author && author !== 'Guest') {
              let existing = Array.from(usersMap.values()).find(x => x.name.toLowerCase() === author.toLowerCase());
              if (existing) {
                existing.docsCount++;
                existing.likesCount += docLikes;
                if (!existing.uid && authorUid) existing.uid = authorUid;
              } else {
                usersMap.set(authorUid || author, {
                  uid: authorUid || '',
                  name: author,
                  photoURL: '',
                  role: 'Verified Contributor',
                  discipline: d.discipline || 'Academic',
                  docsCount: 1,
                  likesCount: docLikes
                });
              }
            }
          });

          allContributors = Array.from(usersMap.values()).filter(c => c.docsCount > 0 || c.uid).sort((a, b) => b.docsCount - a.docsCount);
        } catch(uErr) {
          console.warn("Users collection load warning:", uErr);
        }

        populateDynamicFilters();
        applyFilters();

        if (window.activeSerpTab) {
          window.switchSerpTab(window.activeSerpTab);
        }
      } catch (err) {
        console.error("Failed downloading documents:", err);
      } finally {
        hideLoadingStage();
      }
    }

    function populateDynamicFilters() {
      const catSelect = document.getElementById("filterCategory");
      const discSelect = document.getElementById("filterDiscipline");
      if (!catSelect || !discSelect) return;

      const uniqueCats = [...new Set(allDocs.map(d => d.category).filter(Boolean))].sort();
      const uniqueDiscs = [...new Set(allDocs.map(d => d.discipline).filter(Boolean))].sort();

      catSelect.innerHTML = '<option value="ALL">All Categories</option>';
      uniqueCats.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = cat;
        catSelect.appendChild(opt);
      });

      discSelect.innerHTML = '<option value="ALL">All Disciplines</option>';
      uniqueDiscs.forEach(disc => {
        const opt = document.createElement("option");
        opt.value = disc;
        opt.innerText = disc;
        discSelect.appendChild(opt);
      });
    }

    window.activeFilterChip = 'ALL';

    window.selectFilterChip = function(chipVal) {
      window.activeFilterChip = chipVal || 'ALL';
      document.querySelectorAll('.serp-filter-chip').forEach(c => c.classList.remove('active'));
      const activeChip = document.querySelector(`.serp-filter-chip[data-filter="${chipVal}"]`);
      if (activeChip) activeChip.classList.add('active');
      applyFilters();
    };

    window.resetAllFilters = function() {
      const catSelect = document.getElementById("filterCategory");
      const discSelect = document.getElementById("filterDiscipline");
      const specSelect = document.getElementById("specificFilter");
      const sortSelect = document.getElementById("sortOrder");

      if (catSelect) catSelect.value = 'ALL';
      if (discSelect) discSelect.value = 'ALL';
      if (specSelect) specSelect.value = 'ALL';
      if (sortSelect) sortSelect.value = 'relevance';

      window.activeFilterChip = 'ALL';
      document.querySelectorAll('.serp-filter-chip').forEach(c => c.classList.remove('active'));
      const allChip = document.querySelector('.serp-filter-chip[data-filter="ALL"]');
      if (allChip) allChip.classList.add('active');

      applyFilters();
    };

    function applyFilters() {
      const q = (searchField ? searchField.value.trim() : '').toLowerCase();
      const catVal = document.getElementById("filterCategory")?.value || 'ALL';
      const discVal = document.getElementById("filterDiscipline")?.value || 'ALL';
      const specVal = document.getElementById("specificFilter")?.value || 'ALL';
      const sortVal = document.getElementById("sortOrder")?.value || 'relevance';
      const chipVal = window.activeFilterChip || 'ALL';

      let filtered = allDocs.filter(d => {
        // 1. Search Query Match
        if (q) {
          const titleMatch = (d.title || '').toLowerCase().includes(q);
          const descMatch = (d.description || '').toLowerCase().includes(q);
          const discMatch = (d.discipline || '').toLowerCase().includes(q);
          const catMatch = (d.category || '').toLowerCase().includes(q);
          const tagsMatch = Array.isArray(d.tags) && d.tags.some(t => t.toLowerCase().includes(q));
          if (!titleMatch && !descMatch && !discMatch && !catMatch && !tagsMatch) return false;
        }

        // 2. Category Dropdown Filter
        if (catVal !== 'ALL' && (d.category || '').toLowerCase() !== catVal.toLowerCase()) return false;

        // 3. Discipline Dropdown Filter
        if (discVal !== 'ALL' && (d.discipline || '').toLowerCase() !== discVal.toLowerCase()) return false;

        // 4. Specific Content Filter
        if (specVal === 'notes_only' && (d.isSolution === true || d.solutionUrl)) return false;
        if (specVal === 'solutions_only' && !d.isSolution && !d.solutionUrl) return false;
        if (specVal === 'verified_only' && !d.isVerified && !d.verifiedContributor) return false;

        // 5. Real-Time Filter Chips Matrix
        if (chipVal !== 'ALL') {
          const dTitle = (d.title || '').toLowerCase();
          const dCat = (d.category || '').toLowerCase();
          const dTags = Array.isArray(d.tags) ? d.tags.map(t => t.toLowerCase()) : [];

          if (chipVal === 'SE') {
            const matchesSe = dCat.includes('se') || dCat.includes('sessional') || dTitle.includes('se') || dTitle.includes('sessional') || dTags.some(t => t.includes('se') || t.includes('sessional'));
            if (!matchesSe) return false;
          } else if (chipVal === 'SP') {
            const matchesSp = dCat.includes('sample') || dCat.includes('sp') || dTitle.includes('sample') || dTitle.includes('sp') || dTags.some(t => t.includes('sample') || t.includes('sp'));
            if (!matchesSp) return false;
          } else if (chipVal === 'UE') {
            const matchesUe = dCat.includes('university') || dCat.includes('ue') || dTitle.includes('university') || dTitle.includes('ue') || dTags.some(t => t.includes('university') || t.includes('ue'));
            if (!matchesUe) return false;
          } else if (chipVal === 'T&N') {
            const matchesTn = dCat.includes('tutorial') || dCat.includes('note') || dTitle.includes('tutorial') || dTitle.includes('note') || dTags.some(t => t.includes('tutorial') || t.includes('note'));
            if (!matchesTn) return false;
          } else if (chipVal === 'Practical Solution') {
            const matchesPrac = d.isSolution || d.solutionType === 'practical' || dCat.includes('practical') || dTitle.includes('practical') || dTags.some(t => t.includes('practical'));
            if (!matchesPrac) return false;
          } else if (chipVal === 'Assignment Solution') {
            const matchesAss = d.isSolution || d.solutionType === 'assignment' || dCat.includes('assignment') || dTitle.includes('assignment') || dTags.some(t => t.includes('assignment'));
            if (!matchesAss) return false;
          }
        }

        return true;
      });

      // Sort
      if (sortVal === 'newest') {
        filtered.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      } else if (sortVal === 'likes') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (sortVal === 'views') {
        filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
      } else if (sortVal === 'title') {
        filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
      }

      window.currentSearchResults = filtered;
      const countEl = document.getElementById("resultsCount");
      if (countEl) countEl.innerText = filtered.length;
      renderActiveTabContent();
    }
    window.applyFilters = applyFilters;

    // Attach immediate event listeners for instantaneous filter updates
    ['filterCategory', 'filterDiscipline', 'specificFilter', 'sortOrder'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', () => applyFilters());
        el.addEventListener('input', () => applyFilters());
      }
    });

    function runSearch() {
      const q = searchField ? searchField.value.trim() : '';
      if (queryLabel) queryLabel.innerText = q || 'All Materials';

      const newUrl = new URL(window.location.href);
      if (q) newUrl.searchParams.set("q", q);
      else newUrl.searchParams.delete("q");
      window.history.replaceState(null, null, newUrl);

      showLoadingStage();
      setTimeout(() => {
        hideLoadingStage();
        applyFilters();
      }, 250);
    }

    if (searchField) {
      searchField.addEventListener("keydown", (e) => {
        if (e.key === "Enter") runSearch();
      });
    }

    // ==========================================
    // RENDER TABS CONTENT
    // ==========================================
    function renderActiveTabContent() {
      const results = window.currentSearchResults || [];
      const list = document.getElementById("resultsList");
      const countLabel = document.getElementById("resultsCount");
      if (countLabel) countLabel.innerText = results.length;
      if (!list) return;

      const q = searchField ? searchField.value.trim() : '';

      if (window.activeSerpTab === 'all') renderAllTab(results, q);
      else if (window.activeSerpTab === 'ai') renderAiOverviewTab(results, q);
      else if (window.activeSerpTab === 'website') renderWebsitesTab(q);
      else if (window.activeSerpTab === 'videos') renderVideosTab(q);
      else if (window.activeSerpTab === 'solutions') renderSolutionsTab(results, q);
      else if (window.activeSerpTab === 'contributors') renderContributorsTab(q);
      else renderAllTab(results, q);
    }

    window.sendQuickPrompt = function(promptText) {
      const input = document.getElementById("serpAiChatInput");
      if (input) {
        input.value = promptText;
        sendSerpAiChatMessage();
      }
    };

    window.executeSerpAiQuery = async function(questionText, isInitial = false) {
      const chatInput = document.getElementById("serpAiChatInput");
      const chatBtn = document.getElementById("serpAiSendBtn");
      const feed = document.getElementById("serpAiChatLogContainer");
      if (!feed) return;

      const question = questionText.trim();
      if (!question) return;

      // 1. Render User Message
      const userBubble = document.createElement("div");
      userBubble.className = "ai-msg-bubble user";
      userBubble.innerHTML = `<strong>You:</strong> ${escapeHtml(question)}`;
      feed.appendChild(userBubble);

      if (!isInitial && chatInput) chatInput.value = "";
      if (chatBtn) {
        chatBtn.disabled = true;
        chatBtn.innerHTML = `<i class="ri-loader-4-line ri-spin"></i>`;
      }

      // 2. Render Loading AI Bubble
      const loadingBubble = document.createElement("div");
      loadingBubble.className = "ai-msg-bubble assistant";
      loadingBubble.innerHTML = `<i class="ri-loader-4-line ri-spin" style="color:#7c3aed;"></i> DPGNotes AI is processing your query with Gemini LLM...`;
      feed.appendChild(loadingBubble);
      feed.scrollTop = feed.scrollHeight;

      const userQueryParam = searchField ? searchField.value.trim() : '';
      const backendUrl = apiBase || 'https://dpgnotes.onrender.com';

      try {
        const res = await fetch(backendUrl + '/api/ai/serp-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: userQueryParam,
            question: question,
            contextDocs: (window.currentSearchResults || []).slice(0, 3)
          })
        });

        const data = await res.json();
        if (res.ok && data.answer) {
          loadingBubble.innerHTML = formatAiMessage(data.answer);
        } else {
          throw new Error(data.error || "Backend AI synthesis unavailable");
        }
      } catch (err) {
        console.warn("SERP AI query error:", err);
        loadingBubble.innerHTML = `
          <div style="color:#dc2626; font-size:0.88rem;">
            <i class="ri-error-warning-fill"></i> Unable to complete AI synthesis at this moment: ${escapeHtml(err.message)}
          </div>
          <div style="margin-top:6px; font-size:0.8rem; color:#64748b;">
            Please ensure you are connected to the network or try submitting your query again.
          </div>
        `;
      } finally {
        if (chatBtn) {
          chatBtn.disabled = false;
          chatBtn.innerHTML = `<i class="ri-send-plane-2-fill"></i> Send`;
        }
        feed.scrollTop = feed.scrollHeight;
      }
    };

    function formatAiMessage(responseText) {
      if (!responseText) return "";
      let cleanedResponse = responseText.replace(/^[ \t]+(?=<)/gm, '');
      const hasCodeBlocks = /```[a-zA-Z0-9_-]*\n[\s\S]*?```/.test(cleanedResponse) || /<div\s+class=["']code-container/i.test(cleanedResponse);

      let formattedHtml = typeof marked !== 'undefined' ? marked.parse(cleanedResponse) : cleanedResponse.replace(/\n/g, '<br>');
      if (typeof DOMPurify !== 'undefined') formattedHtml = DOMPurify.sanitize(formattedHtml);

      if (hasCodeBlocks && typeof window.formatSolutionContent === 'function') {
        formattedHtml = window.formatSolutionContent(formattedHtml, 'ai_chat_' + Date.now());
      }

      return `
        <div style="color:#7c3aed; font-weight:700; font-size:0.82rem; margin-bottom:6px; display:flex; align-items:center; gap:6px;">
          <i class="ri-sparkling-fill"></i> DPGNotes AI Assistant
        </div>
        <div class="ai-parsed-content" style="line-height:1.65;">
          ${formattedHtml}
        </div>
      `;
    }

    window.sendSerpAiChatMessage = function() {
      const chatInput = document.getElementById("serpAiChatInput");
      if (!chatInput) return;
      const question = chatInput.value.trim();
      if (!question) return;
      window.executeSerpAiQuery(question, false);
    };

        return;
      }

      let html = `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; width:100%; max-width:960px;">`;
      contributors.forEach(c => {
        const initial = (c.name || 'C').charAt(0).toUpperCase();
        const avatarContent = c.photoURL 
          ? `<img src="${c.photoURL}" alt="${escapeHtml(c.name)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" onerror="this.onerror=null; this.parentNode.innerText='${initial}';">` 
          : initial;

        const profileLink = c.uid ? `profile.html?uid=${encodeURIComponent(c.uid)}` : 'profile.html';

        html += `
          <div class="result-card" style="display:flex; align-items:center; gap:14px; padding:1.1rem;">
            <div style="width:48px; height:48px; border-radius:50%; background:#1a73e8; color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.2rem; flex-shrink:0; overflow:hidden;">
              ${avatarContent}
            </div>
            <div style="flex:1; min-width:0;">
              <h4 style="margin:0 0 3px 0; font-size:1rem; font-weight:700; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                <a href="${profileLink}" style="color:#1e293b; text-decoration:none;">${escapeHtml(c.name)}</a>
              </h4>
              <div style="font-size:0.78rem; color:#5f6368; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml(c.role || 'Contributor')} &bull; ${escapeHtml(c.discipline || 'General')}
              </div>
              <div style="font-size:0.75rem; color:#64748b; margin-top:2px;">
                <strong>${c.docsCount || 0}</strong> ${c.docsCount === 1 ? 'resource' : 'resources'} &bull; <strong>${c.likesCount || 0}</strong> likes
              </div>
            </div>
            <a href="${profileLink}" class="result-btn-open" style="padding:5px 12px; font-size:0.78rem; flex-shrink:0;">
              View Profile <i class="ri-arrow-right-line"></i>
            </a>
          </div>
        `;
      });
      html += `</div>`;
      list.innerHTML = html;
    }

    // =======================================================
    // YOUTUBE VIDEO MODAL HANDLERS (ENFORCING NO HIDE & AUTO RESTART)
    // =======================================================
    window.openSerpVideoModalById = function(id) {
      const item = (window.currentVideosTabItems || []).find(v => v.id === id);
      if (!item) return;

      const modal = document.getElementById("serpVideoPlayerModal");
      const iframe = document.getElementById("serpModalIframe");
      const title = document.getElementById("serpModalVideoTitle");
      const channel = document.getElementById("serpModalChannel");
      const fullBtn = document.getElementById("serpModalFullScreenBtn");
      const spBadge = document.getElementById("serpModalSponsoredBadge");

      const ytId = extractYouTubeId(item.url || '');
      if (iframe && ytId) {
        // Enforce Auto Restart Policy: enablejsapi=1, loop=1, playlist=ytId
        iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1&loop=1&playlist=${ytId}&rel=0`;
      }

      if (title) title.innerText = item.title || 'Educational Demonstration';
      if (channel) channel.innerText = `Source: ${item.source || 'Akshat Network Hub'}`;
      if (spBadge) spBadge.style.display = item.isSponsored ? 'inline-block' : 'none';

      const renderUrl = item.isSponsored ? `dpgnotes-video.html?adId=${encodeURIComponent(item.id)}` : `dpgnotes-video.html?id=${encodeURIComponent(item.id)}`;
      if (fullBtn) fullBtn.href = renderUrl;

      window.activeModalVideoItem = item;
      if (modal) modal.style.display = "flex";
    };

    window.closeSerpVideoModal = function() {
      const modal = document.getElementById("serpVideoPlayerModal");
      const iframe = document.getElementById("serpModalIframe");
      if (iframe) iframe.src = "";
      if (modal) modal.style.display = "none";
      window.activeModalVideoItem = null;
    };

    window.shareSerpModalVideo = async function() {
      const item = window.activeModalVideoItem;
      if (!item) return;
      await window.shareVideoItemNative(item);
    };

    window.shareSerpVideoItem = async function(id) {
      const item = (window.currentVideosTabItems || []).find(v => v.id === id);
      if (!item) return;
      await window.shareVideoItemNative(item);
    };

    window.shareVideoItemNative = async function(item) {
      if (!item) return;
      const token = "VSH_" + Math.random().toString(36).substring(2, 9).toUpperCase();
      try {
        await setDoc(doc(db, "share_links", token), {
          token: token,
          type: item.isSponsored ? "ad_video" : "video",
          videoId: item.id,
          targetId: item.id,
          title: item.title || "Academic Video",
          uploader: item.source || "DPGNotes Contributor",
          clicks: 0,
          createdAt: new Date().toISOString()
        });

        const targetCol = item.isSponsored ? "user_ads" : "videos";
        updateDoc(doc(db, targetCol, item.id), { shares: increment(1) }).catch(() => {});
        if (!item.isSponsored) {
          updateDoc(doc(db, "Video", item.id), { shares: increment(1) }).catch(() => {});
        }
      } catch (e) {
        console.warn("Share token creation failed:", e);
      }

      const shareUrl = `${window.location.origin}/dpgnotes-video.html?token=${token}`;
      const videoTitle = item.title || "Educational Video";
      const shareTitle = `${videoTitle} — DPGNotes`;
      const shareText = `Watch "${videoTitle}" on DPGNotes - Verified Academic Resource:\n`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: shareTitle,
            text: shareText,
            url: shareUrl
          });
          return;
        } catch (shareErr) {
          if (shareErr.name === 'AbortError') return;
          console.warn("navigator.share failed, fallback to clipboard:", shareErr);
        }
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert(`Share link copied to clipboard!\n${shareUrl}`);
          return;
        } catch(cErr) {}
      }
      prompt("Copy video share link:", shareUrl);
    };

    // Initialize Page
    loadDocuments();
  </script>
  <script src="redirect.js"></script>
</body>
</html>
