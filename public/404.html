  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5515547448097504" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #020617;
      --surface: rgba(15, 23, 42, 0.75);
      --surface-hover: rgba(30, 41, 59, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(99, 102, 241, 0.5);
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --emerald: #10b981;
      --text: #ffffff;
      --text-muted: #cbd5e1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .error-container {
      position: relative;
      z-index: 10;
      max-width: 660px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px var(--primary-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand badge centered directly above 404 */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px;
      color: #c7d2fe;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.25rem;
    }

    .brand-badge img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .error-code-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(4.8rem, 14vw, 7.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, #818cf8 70%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(99, 102, 241, 0.4);
    }

    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.4rem, 4.5vw, 1.85rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 1.25rem;
    }

    .requested-path-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      color: #fca5a5;
      margin-bottom: 1.8rem;
      word-break: break-all;
      max-width: 100%;
    }

    .requested-path-box svg {
      flex-shrink: 0;
      color: #f87171;
    }

    /* Fluid responsive search form */
    .search-section {
      width: 100%;
      margin-bottom: 1.8rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px 6px 5px 14px;
      transition: all 0.3s;
      width: 100%;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .search-box input {
      flex: 1;
      min-width: 0; /* Prevents overflow bug on small screens! */
      background: transparent;
      border: none;
      outline: none;
      padding: 8px 6px;
      color: #ffffff;
      font-size: 0.95rem;
    }

    .search-box input::placeholder {
      color: #94a3b8;
    }

    .search-box button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #ffffff;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .search-box button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* Action buttons: Desktop/Tablet 3 columns, Mobile stacked */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      min-height: 44px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #ffffff;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--primary-glow);
      color: #ffffff;
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      color: #f1f5f9;
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Footer */
    .error-footer {
      margin-top: 2rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.82rem;
      position: relative;
      z-index: 10;
    }

    .error-footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .error-footer a:hover {
      text-decoration: underline;
    }

    /* Tablet breakpoint (481px - 768px) */
    @media (max-width: 768px) {
      .error-container {
        padding: 2.5rem 1.8rem;
      }
    }

    /* Mobile breakpoint (<= 480px) */
    @media (max-width: 480px) {
      .error-container {
        padding: 2.2rem 1.25rem;
        border-radius: 20px;
      }
      .action-grid {
        grid-template-columns: 1fr;
      }
      .search-box {
        padding: 4px 4px 4px 10px;
      }
      .search-box button {
        padding: 8px 14px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>

  <main class="error-container" role="main">
    <div class="brand-badge">
      <img src="/ANH.png" alt="DPGNotes Logo" />
      <span>DPGNotes</span>
    </div>

    <div class="error-code-wrapper">
      <div class="error-code">404</div>
    </div>

    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The resource or URL you requested is missing, moved, or temporarily unavailable.
    </p>

    <div class="requested-path-box" id="brokenPathContainer" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="brokenPathText"></span>
    </div>

    <!-- Quick Search -->
    <div class="search-section">
      <form class="search-box" id="errorSearchForm" onsubmit="handleSearch(event)">
        <input type="text" id="errorSearchInput" placeholder="Search syllabus, papers, notes..." autocomplete="off" />
        <button type="submit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Search
        </button>
      </form>
    </div>

    <!-- Actions -->
    <div class="action-grid">
      <a href="/" class="btn-action btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </a>

      <a href="/study-hub.html" class="btn-action btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        Study Hub
      </a>

      <a href="/legal/index.html" class="btn-action btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        Legal Center
      </a>
    </div>
  </main>

  <footer class="error-footer">
    <p>&copy; DPGNotes &bull; Powered by <a href="https://akshat-881236.github.io/portfolio/" target="_blank" rel="noopener">Akshat Network Hub</a></p>
  </footer>

  <script>
    // 1. Ensure 404 page runs in its own scope and URL, resolving browser console 404 error
    (function ensureScopeAndUrl() {
      try {
        const path = window.location.pathname;
        if (path !== '/404.html' && path !== '/404') {
          // Transition to /404.html URL so page is in its own scope and returns clean HTTP 200
          window.location.replace('/404.html?missing=' + encodeURIComponent(path + window.location.search));
          return;
        }

        // Display missing path from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const missingPath = urlParams.get('missing');
        if (missingPath) {
          const brokenContainer = document.getElementById('brokenPathContainer');
          const brokenText = document.getElementById('brokenPathText');
          if (brokenContainer && brokenText) {
            brokenText.textContent = 'Missing: ' + missingPath;
            brokenContainer.style.display = 'inline-flex';
          }
        }
      } catch(e) {}
    })();

    // 2. Search redirect handler
    function handleSearch(e) {
      e.preventDefault();
      const input = document.getElementById('errorSearchInput');
      const query = input ? input.value.trim() : '';
      if (query) {
        window.location.href = '/dpgnotes-search-engine.html?q=' + encodeURIComponent(query);
      } else {
        window.location.href = '/dpgnotes-search-engine.html';
      }
    }
  </script>
</body>
</html>
