<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
  <script src="custom-dialogs.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPGNotes | Share Report Analytics</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --report-bg: #0f111a;
      --report-surface: rgba(20, 24, 39, 0.7);
      --report-border: rgba(255, 255, 255, 0.08);
      --report-primary: #8b5cf6;
      --report-text: #f8fafc;
      --report-muted: #94a3b8;
      --report-danger: #ef4444;
      --report-success: #10b981;
    }
    
    body {
      background: var(--report-bg);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      color: var(--report-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #authCheckOverlay {
      position: fixed;
      inset: 0;
      background: var(--report-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.1);
      border-top-color: var(--report-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .report-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
      width: 100%;
      box-sizing: border-box;
      display: none;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--report-border);
      padding-bottom: 1.5rem;
    }
    .report-header h1 {
      margin: 0;
      font-size: 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .report-header h1 i { color: var(--report-primary); }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .stat-box {
      background: var(--report-surface);
      border: 1px solid var(--report-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .stat-box h3 { margin: 0 0 0.5rem 0; color: var(--report-muted); font-size: 0.9rem; font-weight: 500; }
    .stat-box p { margin: 0; font-size: 2rem; font-weight: 700; }
    
    .data-card {
      background: var(--report-surface);
      border: 1px solid var(--report-border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .data-card h2 { margin-top: 0; font-size: 1.3rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px;}
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--report-border); }
    th { color: var(--report-muted); font-weight: 500; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-usual { background: rgba(16, 185, 129, 0.1); color: var(--report-success); }
    .badge-unusual { background: rgba(239, 68, 68, 0.1); color: var(--report-danger); }
    
    .back-btn {
      padding: 0.8rem 1.5rem;
      background: rgba(255,255,255,0.1);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  
  <div id="authCheckOverlay">
    <div class="spinner"></div>
    <h2 id="authStatusText">Verifying Secure Admin Session...</h2>
    <p style="color: var(--report-muted);" id="authSubText">Ensuring robust security protocols</p>
  </div>
  
  <div class="report-container" id="reportContainer">
    <div class="report-header">
      <h1><i class="ri-bar-chart-box-line"></i> Engagement Report</h1>
      <div style="display:flex; gap:10px;">
        <a href="legal/index.html" class="back-btn" style="background:rgba(139,92,246,0.1); color:var(--report-primary);"><i class="ri-shield-user-line"></i> Legal Policies</a>
        <button onclick="window.close()" class="back-btn"><i class="ri-close-line"></i> Close Report</button>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <h3>Total Opens</h3>
        <p id="totalOpens">0</p>
      </div>
      <div class="stat-box">
        <h3>Unique Visitors (IPs)</h3>
        <p id="uniqueVisitors">0</p>
      </div>
      <div class="stat-box">
        <h3>Unusual Activity</h3>
        <p id="unusualActivity" style="color:var(--report-danger);">0</p>
      </div>
      <div class="stat-box">
        <h3>Resource Title</h3>
        <p id="resourceTitle" style="font-size: 1.2rem; margin-top: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Loading...</p>
      </div>
    </div>
    
    <div class="data-card">
      <h2><i class="ri-history-line"></i> Engagement Traffic Log</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>IP Address</th>
              <th>Status</th>
              <th>Device / Agent</th>
            </tr>
          </thead>
          <tbody id="engagementsBody">
            <tr><td colspan="4" style="text-align:center;">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="report.js"></script>
</body>
</html>
