  width:100%;
  border-collapse:collapse;
  margin:1.5rem 0;
  overflow:auto;
  display:block;
}
.markdown th{
  background:#111827;
  padding:1rem;
  border:
  1px solid #1e293b;
  text-align:left;
}
.markdown td{
  padding:1rem;
  border:
  1px solid #1e293b;
  color:#cbd5e1;
}
/* =========================================
   CODE
========================================= */
.markdown pre{
  background:#020617;
  border:
  1px solid #1e293b;
  border-radius:18px;
  overflow:auto;
  padding:1rem;
  margin:1.5rem 0;
}
.markdown code{
  font-family:
  Consolas,
  monospace;
}
/* =========================================
   LOADER
========================================= */
.loader{
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#94a3b8;
}
/* =========================================
   ERROR BOX
========================================= */
.error-box{
  background:#450a0a;
  border:
  1px solid #7f1d1d;
  color:#fecaca;
  padding:1.5rem;
  border-radius:18px;
  line-height:1.8;
}
/* =========================================
   FOOTER
========================================= */
.footer{
  text-align:center;
  padding:2rem 1rem;
  color:#64748b;
}
/* =========================================
   MOBILE
========================================= */
@media(max-width:768px){
  .header-inner{
    flex-direction:column;
    align-items:flex-start;
    gap:1rem;
  }
  .logo{
    font-size:1rem;
  }
  .actions{
    width:100%;
    display:grid;
    grid-template-columns:
    repeat(2,1fr);
    gap:.8rem;
  }
  .btn{
    width:100%;
    padding:.9rem .8rem;
    font-size:.92rem;
    border-radius:14px;
  }
  .doc-content{
    padding:1rem;
  }
  .markdown table{
    font-size:.9rem;
  }
  .markdown h1{
    font-size:1.7rem;
  }
  .markdown h2{
    font-size:1.35rem;

}
</style>
  <script src="/history-monitoring.js" defer></script>
</head>
<body>
<!-- =====================================
     HEADER
===================================== -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      🚀 DPGNotes Documentation
    </div>
    <div class="actions">
      <a
        href="../legal/index.html"
        class="btn"
        style="text-decoration:none;"
      >
        Legal Center
      </a>
      <button
        class="btn"
        onclick="loadREADME()"
      >
        Refresh
      </button>
      <button
        class="btn"
        onclick="window.scrollTo({
          top:0,
          behavior:'smooth'
        })"
      >
        Back To Top
      </button>
    </div>
  </div>
</header>
<!-- =====================================
     MAIN
===================================== -->
<main class="main">
  <div class="doc-wrapper">
    <div class="doc-top">
      <h2>
        README.md Renderer
      </h2>
      <span id="status">
        Initializing...
      </span>
    </div>
    <div
      id="docContent"
      class="doc-content"
    >
      <div class="loader">
        Loading README.md...
      </div>
    </div>
  </div>
</main>
<!-- =====================================
     FOOTER
===================================== -->
<footer class="footer">
  DPGNotes • Smart Documentation Engine
</footer>
<script>
/* =========================================
   ABSOLUTE README PATH
========================================= */
/*
IMPORTANT:
Move README.md inside:
public/
Final Structure:
public/
 ├── Documentation.htm
 ├── README.md
 ├── index.html
*/
const README_PATH =
"./docs.md";
/* =========================================
   MARKED CONFIG
========================================= */
if(window.marked){
  marked.setOptions({
    breaks:true,
    gfm:true
  });
}
/* =========================================
   CUSTOM FALLBACK ENGINE
========================================= */
function fallbackMarkdown(md){
  md = md.replace(
    /^# (.*$)/gim,
    "<h1>$1</h1>"
  );
  md = md.replace(
    /^## (.*$)/gim,
    "<h2>$1</h2>"
  );
  md = md.replace(
    /^### (.*$)/gim,
    "<h3>$1</h3>"
  );
  md = md.replace(
    /^#### (.*$)/gim,
    "<h4>$1</h4>"
  );
  md = md.replace(
    /\*\*(.*?)\*\*/gim,
    "<strong>$1</strong>"
  );
  md = md.replace(
    /\[(.*?)\]\((.*?)\)/gim,
    '<a href="$2" target="_blank">$1</a>'
  );
  md = md.replace(
    /`(.*?)`/gim,
    "<code>$1</code>"
  );
  md = md.replace(
    /^\- (.*$)/gim,
    "<li>$1</li>"
  );
  md = md.replace(
    /\n/g,
    "<br>"
  );
  return md;
}
/* =========================================
   LOAD README
========================================= */
async function loadREADME(){
  try{
    document.getElementById(
      "status"
    ).textContent =
    "Fetching README...";
    const response =
    await fetch(
      README_PATH,
      {
        cache:"no-cache"
      }
    );
    if(!response.ok){
      throw new Error(
        "README.md not found"
      );
    }
    const markdown =
    await response.text();
    let html = "";
    if(window.marked){
      html = marked.parse(
        markdown
      );
    }else{
      console.warn(
        "Marked.js failed. Using fallback engine."
      );
      html = fallbackMarkdown(
        markdown
      );
    }
    document.getElementById(
      "docContent"
    ).innerHTML =
    `
    <div class="markdown">
${html}
    </div>
    `;
    document.getElementById(
      "status"
    ).textContent =
    "README Loaded";
    if(window.hljs){
      hljs.highlightAll();
    }else{
      console.warn(
        "Highlight.js not loaded"
      );
    }
  }catch(error){
    console.error(error);
    document.getElementById(
      "docContent"
    ).innerHTML =
    `
    <div class="error-box">
      <h2>
        README Load Failed
      </h2>
      <br>
      Possible reasons:
      <ul>
        <li>
          README.md not inside public folder
        </li>
        <li>
          Wrong README path
        </li>
        <li>
          Firebase Hosting cache issue
        </li>
        <li>
          CDN blocked
        </li>
      </ul>
    </div>
    `;
    document.getElementById(
      "status"
    ).textContent =
    "Load Failed";
  }
}
/* =========================================
   INIT
========================================= */
window.addEventListener(
  "DOMContentLoaded",
  ()=>{
    loadREADME();
  }
);
</script>
  <script src="../redirect.js"></script>
</body>
</html>
