<html lang="en">
<head>

  <meta name="keywords" content="DPGNotes Search, Academic Search Engine, University Notes Finder, BCA PYQ, Computer Science Search, Physical Education Notes, Exam Preparation" />

  <style>
    :root {
      --bg-top: #0b0f19;
      --bg-bottom: #030712;
      --surface: rgba(17, 24, 39, 0.6);
      --surface-hover: rgba(31, 41, 55, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-light: #8b5cf6;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --shadow: 0 10px 40px rgba(0,0,0,0.5);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Core Search Box Wrapper */
    .search-container {
      width: 100%;
      max-width: 720px;
      text-align: center;
      z-index: 10;
      animation: fadeIn 0.8s ease-out;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      margin: 0 auto 1.5rem;
      color: white;
      box-shadow: 0 8px 30px var(--primary-glow);
      animation: bounce 3s ease-in-out infinite;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    /* Interactive Search bar */
    .search-box-wrapper {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.4rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), 0 20px 40px rgba(0,0,0,0.6);
      transform: scale(1.01);
    }

    .search-icon {
      color: var(--primary-light);
      font-size: 1.5rem;
      margin-left: 1rem;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 1.15rem;
      padding: 0.8rem 0.5rem;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 18px;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .search-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    /* Live suggestions panel in normal document flow */
    .suggestions-panel {
      position: relative;
      width: 100%;
      max-width: 680px;
      background: rgba(17, 24, 39, 0.98);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-height: 360px;
      overflow-y: auto;
      text-align: left;
      display: none;
      margin-top: 0.8rem;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(24px);
      box-sizing: border-box;
    }
    
    .suggestions-panel.active {
      display: block !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: translateY(0) !important;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: background 0.2s;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: var(--surface-hover);
    }

    .suggestion-info {
      flex: 1;
      margin-right: 1.5rem;
    }

    .suggestion-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      margin-bottom: 0.15rem;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .suggestion-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.8rem;
    }

    .suggestion-meta span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .suggestion-arrow {
      color: var(--primary-light);
      font-size: 1.2rem;
      transition: transform 0.25s;
    }

    .suggestion-item:hover .suggestion-arrow {
      transform: translateX(4px);
    }

    .no-results-item {
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Background lights decoration */
    .bg-light-1 {
      position: absolute;
      top: 10%; left: 5%; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-light-2 {
      position: absolute;
      bottom: 10%; right: 5%; width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Responsiveness Rules */
    @media (max-width: 480px) {
      .brand-title { font-size: 2rem; }
      .brand-subtitle { font-size: 0.85rem; }
      .search-box-wrapper { flex-direction: row; border-radius: var(--radius-md); padding: 0.2rem; }
      .search-icon { font-size: 1.2rem; margin-left: 0.5rem; }
      .search-input { font-size: 1rem; padding: 0.6rem 0.3rem; }
      .search-btn { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-light-1"></div>
  <div class="bg-light-2"></div>

  <!-- Top Header Native Sponsored Ad Banner -->
  <div class="native-ads" data-ad-variant="header" data-ad-count="1" style="width:100%; max-width:900px; margin:0.5rem auto; padding:0 1rem; box-sizing:border-box;"></div>

  <div class="search-container">
    <div class="brand-logo">
      <i class="ri-search-eye-line"></i>
    </div>
    <h1 class="brand-title">DPG<span style="color:var(--primary-light);">Notes</span> Search</h1>
    <p class="brand-subtitle">Academic Intelligence & Sessional Search Portal for DPG College</p>

    <!-- Mini Google Style Search Box -->
    <div class="search-box-wrapper" style="box-shadow: 0 12px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12); padding: 0.35rem 0.6rem;">
      <i class="ri-search-line search-icon" style="font-size:1.3rem; color:var(--primary-light);"></i>
      <input type="text" class="search-input" id="engineSearchInput" placeholder="Search sessional notes, PYQs, subjects, or keywords..." autocomplete="off">
      
      <div style="display:flex; align-items:center; gap:8px; margin-right:6px;">
        <button type="button" title="Voice Search" onclick="startVoiceSearch()" style="background:none; border:none; color:#a78bfa; font-size:1.25rem; cursor:pointer; padding:4px 6px; border-radius:50%; transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='none'"><i class="ri-mic-line"></i></button>
        <button type="button" title="DPG Lens Search" onclick="triggerDpgLensUpload()" style="background:none; border:none; color:#38bdf8; font-size:1.25rem; cursor:pointer; padding:4px 6px; border-radius:50%; transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='none'"><i class="ri-camera-lens-line"></i></button>
      </div>

      <input type="file" id="dpgLensFileInput" accept="image/*,.pdf" style="display:none;" onchange="handleDpgLensFileSelected(this)">
      <button class="search-btn" onclick="triggerSearchRedirect()"><i class="ri-search-line"></i> Search</button>
    </div>

    <!-- Quick Action Buttons & Category Chips (Google Style) -->
    <div style="display:flex; justify-content:center; gap:10px; margin-top:1rem; flex-wrap:wrap;">
      <button onclick="triggerSearchRedirect()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text); padding:0.5rem 1.1rem; border-radius:12px; font-size:0.85rem; font-family:inherit; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.borderColor='var(--primary)'; this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='rgba(255,255,255,0.06)'">DPGNotes Search</button>
      <button onclick="luckyRedirect()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text); padding:0.5rem 1.1rem; border-radius:12px; font-size:0.85rem; font-family:inherit; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.borderColor='#f59e0b'; this.style.background='rgba(245,158,11,0.15)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='rgba(255,255,255,0.06)'">I'm Feeling Lucky ⚡</button>
    </div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:1rem; flex-wrap:wrap; font-size:0.8rem;">
      <span class="btag" style="cursor:pointer; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3); color:#a78bfa; padding:4px 12px; border-radius:20px;" onclick="window.location.href='/dpgnotes-serp.html?q=Sessional+Notes&category=Notes'"><i class="ri-file-text-line"></i> Sessional Notes</span>
      <span class="btag" style="cursor:pointer; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3); color:#60a5fa; padding:4px 12px; border-radius:20px;" onclick="window.location.href='/dpgnotes-serp.html?q=PYQ&category=Question+Paper'"><i class="ri-question-line"></i> PYQs</span>
      <span class="btag" style="cursor:pointer; background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.3); color:#34d399; padding:4px 12px; border-radius:20px;" onclick="window.location.href='/dpgnotes-serp.html?q=Computer+Science&discipline=Computer+Science'"><i class="ri-code-s-slash-line"></i> Computer Science</span>
      <span class="btag" style="cursor:pointer; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); color:#fbbf24; padding:4px 12px; border-radius:20px;" onclick="window.location.href='/dpgnotes-serp.html?q=Syllabus&category=Syllabus'"><i class="ri-book-line"></i> Syllabus</span>
    </div>

    <!-- Live Auto-suggestions Container -->
    <div class="suggestions-panel" id="suggestionsPanel">
      <div class="no-results-item">Start typing to scan documents...</div>
    </div>

    <!-- Feed Native Ad Container -->
    <div class="native-ads" id="native-ads" data-ad-variant="feed" data-ad-count="1" style="margin-top:1.5rem; width:100%; max-width:600px; transition:margin-top 0.3s ease;"></div>

    <!-- Google AdSense Placeholder -->
    <div class="ad-banner-section" style="margin-top:1.5rem; width:100%; max-width:600px;">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-5515547448097504"
           data-ad-slot="1234567890"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>

  <!-- Bottom Footer Native Sponsored Ad Banner -->
  <div class="native-ads" data-ad-variant="footer" data-ad-count="1" style="width:100%; max-width:900px; margin:2rem auto 1rem auto; padding:0 1rem; box-sizing:border-box;"></div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClhxuoGf7ELHD0srUBUPyQM6_CvYNafIE",
      authDomain: "dpgnotes.firebaseapp.com",
      projectId: "dpgnotes",
      storageBucket: "dpgnotes.firebasestorage.app",
      messagingSenderId: "910494426039",
      appId: "1:910494426039:web:adeae5315caaf846c43e32"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDocs = [];

    // Pre-load metadata for instant suggestion queries
    async function loadDocumentsCache() {
      try {
        const snap = await getDocs(collection(db, "documents"));
        allDocs = [];
        snap.forEach(doc => {
          allDocs.push({ id: doc.id, ...doc.data() });
        });
      } catch (err) {
        console.error("Failed caching documents:", err);
      }
    }

    const input = document.getElementById("engineSearchInput");
    const panel = document.getElementById("suggestionsPanel");

    input.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        panel.innerHTML = '<div class="no-results-item">Start typing to scan documents...</div>';
        panel.classList.remove("active");
        return;
      }

      const matches = allDocs.filter(d => 
        (d.title && d.title.toLowerCase().includes(q)) ||
        (d.description && d.description.toLowerCase().includes(q)) ||
        (d.discipline && d.discipline.toLowerCase().includes(q)) ||
        (d.category && d.category.toLowerCase().includes(q))
      ).slice(0, 5); // Max 5 instant suggestions

      if (matches.length === 0) {
        panel.innerHTML = '<div class="no-results-item">No matching documents found.</div>';
      } else {
        panel.innerHTML = "";
        matches.forEach(d => {
          const tagsString = Array.isArray(d.tags) ? d.tags.join(", ") : (d.tags || "");
          const viewerUrl = `/dpgnotes-pdf-viewer.html?pdf=${encodeURIComponent(d.pdfUrl || '')}&title=${encodeURIComponent(d.title || '')}&category=${encodeURIComponent(d.category || '')}&discipline=${encodeURIComponent(d.discipline || '')}&uploader=${encodeURIComponent(d.userName || d.uploader || 'Contributor')}&docid=${encodeURIComponent(d.id)}&description=${encodeURIComponent(d.description || '')}&tags=${encodeURIComponent(tagsString)}&search-token=SEARCH_SUGGESTION`;

          const item = document.createElement("a");
          item.className = "suggestion-item";
          item.href = viewerUrl;
          item.style.textDecoration = "none";
          item.innerHTML = `
            <div class="suggestion-info">
              <div class="suggestion-title">${d.title}</div>
              <div class="suggestion-meta">
                <span><i class="ri-folder-line"></i> ${d.category}</span>
                <span><i class="ri-book-open-line"></i> ${d.discipline}</span>
              </div>
            </div>
            <i class="ri-arrow-right-line suggestion-arrow"></i>
          `;
          panel.appendChild(item);
        });
      }
      panel.classList.add("active");
    });

    // Enter Key Trigger
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        window.triggerSearchRedirect();
      }
    });

    window.triggerSearchRedirect = function() {
      const q = input.value.trim();
      if (q) {
        window.location.href = `/dpgnotes-serp.html?q=${encodeURIComponent(q)}`;
      } else {
        window.location.href = `/dpgnotes-serp.html`;
      }
    };

    window.luckyRedirect = function() {
      if (allDocs.length > 0) {
        const randomDoc = allDocs[Math.floor(Math.random() * allDocs.length)];
        const tagsString = Array.isArray(randomDoc.tags) ? randomDoc.tags.join(", ") : (randomDoc.tags || "");
        window.location.href = `/dpgnotes-pdf-viewer.html?pdf=${encodeURIComponent(randomDoc.pdfUrl || '')}&title=${encodeURIComponent(randomDoc.title || '')}&category=${encodeURIComponent(randomDoc.category || '')}&discipline=${encodeURIComponent(randomDoc.discipline || '')}&uploader=${encodeURIComponent(randomDoc.userName || randomDoc.uploader || 'Contributor')}&docid=${encodeURIComponent(randomDoc.id)}&description=${encodeURIComponent(randomDoc.description || '')}&tags=${encodeURIComponent(tagsString)}&search-token=LUCKY`;
      } else {
        window.location.href = `/dpgnotes-serp.html`;
      }
    };

    window.startVoiceSearch = function() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser environment. Please type your query.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();
      input.placeholder = "🎙️ Listening... Speak your search query now";
      
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        window.triggerSearchRedirect();
      };
      recognition.onerror = () => {
        input.placeholder = "Search sessional notes, PYQs, subjects, or keywords...";
      };
    };

    window.triggerDpgLensUpload = function() {
      const fileInput = document.getElementById("dpgLensFileInput");
      if (fileInput) fileInput.click();
    };

    window.handleDpgLensFileSelected = async function(inputEl) {
      if (!inputEl.files || inputEl.files.length === 0) return;
      const file = inputEl.files[0];
      const searchBox = document.getElementById("engineSearchInput");
      if (searchBox) searchBox.value = `📷 DPG Lens Scanning: ${file.name}...`;

      try {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result;
          const apiBase = (typeof window.API_BASE_URL === 'string' && window.API_BASE_URL !== 'undefined') ? window.API_BASE_URL : '';
          
          const res = await fetch(apiBase + '/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `DPG Lens Visual Analysis: Analyze file "${file.name}" and extract academic subject keywords, topic, and notes classification for DPGNotes search engine.`,
              systemContext: 'DPG Lens Visual Recognition Engine'
            })
          });
          const resJson = await res.json();
          const keyword = (resJson.answer || file.name.replace(/\.[^/.]+$/, "")).substring(0, 40);
          if (searchBox) searchBox.value = keyword;
          window.triggerSearchRedirect();
        };
        reader.readAsDataURL(file);
      } catch (err) {
        console.error("DPG Lens Error:", err);
        const fallbackQuery = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        if (searchBox) searchBox.value = fallbackQuery;
        window.triggerSearchRedirect();
      }
    };

    // Load Cache on start
    loadDocumentsCache();
  </script>
  <script src="redirect.js"></script>
</body>
</html>
